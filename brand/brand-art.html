<!doctype html>
<!--
  X (Twitter) profile art for @vestpayouts, in the site's pixel style.
    ?kind=avatar  800x800   (X shows 400x400, cropped to a circle)
    ?kind=banner  3000x1000 (X shows 1500x500)
  Render with: node brand/render-brand-art.mjs
-->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
<style>html, body { margin: 0; background: #0b0c0f; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(async () => {
await document.fonts.load("40px 'Press Start 2P'");
const KINDS = { avatar: [800, 800], banner: [3000, 1000], "vest-avatar": [800, 800], "vest-sheet": [2000, 700] };
const asked = new URLSearchParams(location.search).get("kind");
const kind = asked in KINDS ? asked : "avatar";
const [W, H] = KINDS[kind];
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

let seed = kind === "banner" ? 4242 : kind.startsWith("vest") ? 2024 : 777;
const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };

const INK = "#15161a", WHITE = "#ffffff";
const BLUE   = ["#0a1a5c", "#1438a8", "#1f6fff", "#3fb2ff", "#7fe3ff", "#c9f6ff", "#ffffff", "#ffffff"];
const YELLOW = ["#5c3a0a", "#8f5e12", "#c98a1a", "#f2b632", "#ffd04a", "#ffe680", "#fff6c2", "#ffffff"];
const RED    = ["#3a0505", "#6b0a0a", "#9e1010", "#d01c14", "#ff3b1f", "#ff6a3d", "#ffa07a", "#ffe0d0"];
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const lerp = (a, b, f) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * f)).join(",")})`; };
/** Colour for heat band `l` (1-8) at horizontal position f (0..1): blue → yellow → red. */
// Pure colour zones with dithered borders (blending blue into yellow goes grey).
function heatColor(l, f, pal) {
  if (pal) return pal[l - 1];
  const zone = (a, b, from, to) => (rnd() < (f - from) / (to - from) ? b : a)[l - 1];
  if (f < 0.28) return BLUE[l - 1];
  if (f < 0.4) return zone(BLUE, YELLOW, 0.28, 0.4);
  if (f < 0.56) return YELLOW[l - 1];
  if (f < 0.68) return zone(YELLOW, RED, 0.56, 0.68);
  return RED[l - 1];
}

/* ---------- Background ---------- */
px(0, 0, W, H, "#0b0c0f");
const grid = kind === "banner" ? 50 : 40;
ctx.strokeStyle = "rgba(255,255,255,0.045)"; ctx.lineWidth = 2;
for (let x = 0; x <= W; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
for (let y = 0; y <= H; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

/* ---------- Doom fire ---------- */
function fire({ cell, heightFrac, span = [0, 1], pal, maxLevel = 8, alpha = 1 }) {
  const GW = Math.ceil(W / cell), GH = Math.ceil(H / cell), MAX = 48;
  const heat = new Float32Array(GW * GH);
  const cool = MAX / (GH * heightFrac);
  const l0 = Math.floor(GW * span[0]), l1 = Math.ceil(GW * span[1]);
  for (let it = 0; it < GH * 4; it++) {
    for (let x = 0; x < GW; x++) {
      const edge = Math.min(x - l0, l1 - 1 - x);
      heat[(GH - 1) * GW + x] = x >= l0 && x < l1 && (edge > 3 || rnd() < 0.5) && rnd() < 0.94 ? (maxLevel / 8) * MAX : 0;
    }
    for (let y = 1; y < GH; y++) for (let x = 0; x < GW; x++) {
      const r = (rnd() * 3) | 0, dx = Math.min(GW - 1, Math.max(0, x - r + 1));
      heat[(y - 1) * GW + dx] = Math.max(0, heat[y * GW + x] - Math.floor(rnd() * 2 * cool + 0.5));
    }
  }
  const src = heat.slice();
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    let s = 0, n = 0;
    for (let dy = 0; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || xx >= GW || yy >= GH) continue;
      const w = dx === 0 && dy === 0 ? 2 : 1; s += src[yy * GW + xx] * w; n += w;
    }
    heat[y * GW + x] = s / n;
  }
  ctx.globalAlpha = alpha;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const l = Math.min(8, Math.ceil((heat[y * GW + x] / MAX) * 8));
    if (l > 0) px(x * cell, y * cell, cell, cell, heatColor(l, x / GW, pal));
  }
  ctx.globalAlpha = 1;
  return { GW, GH, heat };
}

/* ---------- Critter ---------- */
const SPRITE = [
  "....BBBB....", "..BBBBBBBB..", ".BBBBBBBBBB.", "BBBBBBBBBBBB", "BBBBBBBBBBBB", "BBBBBBBBBBBB",
  "BBBBBBBBBBBB", "BBBBBBBBBBBB", "bBBBBBBBBBBb", ".bBBBBBBBBb.", "..bb....bb..", "..bb....bb..",
];
const BODIES = { gold: ["#f6c445", "#b8841a"], silver: ["#d5d9e0", "#939aa5"], bronze: ["#d0844a", "#9a5426"] };
function critter(cx, cy, S, { body = "gold", shades = true, crown = false, chain = false, face = "grin" } = {}) {
  const O = Math.max(4, Math.round(S * 0.22));
  const [B, b] = BODIES[body];
  const cell = (gx, gy, c) => px(cx + gx * S, cy + gy * S, S, S, c);
  SPRITE.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && px(cx + gx * S - O, cy + gy * S - O, S + 2 * O, S + 2 * O, INK)));
  SPRITE.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && cell(gx, gy, ch === "B" ? B : b)));
  cell(2, 3, WHITE + "aa");
  if (shades) {
    for (let gx = 2; gx <= 9; gx++) cell(gx, 5, INK);
    [2, 3, 4, 7, 8, 9].forEach((gx) => cell(gx, 6, INK));
    cell(3, 5, WHITE); cell(8, 5, WHITE);
  } else {
    [[2, 6], [3, 5], [4, 6], [7, 6], [8, 5], [9, 6]].forEach(([gx, gy]) => cell(gx, gy, INK));
    cell(2, 7, "#ff6b6b99"); cell(9, 7, "#ff6b6b99");
  }
  if (face === "grin") { [4, 5, 6, 7].forEach((gx) => cell(gx, 8, INK)); cell(4, 9, INK); cell(7, 9, INK); cell(5, 9, "#ff6b6b"); cell(6, 9, "#ff6b6b"); }
  else { cell(4, 8, INK); cell(5, 9, INK); cell(6, 9, INK); cell(7, 8, INK); }
  if (chain) {
    const k = S / 22;
    for (let gx = 2; gx <= 9; gx++) px(cx + gx * S + 3 * k, cy + 10 * S - 18 * k + (gx === 2 || gx === 9 ? -10 * k : 0), S - 6 * k, 8 * k, "#ffd25e");
    px(cx + 5 * S, cy + 10 * S - 12 * k, 2 * S, 2 * S - 8 * k, "#ffd25e");
    ctx.fillStyle = INK; ctx.font = `${Math.round(20 * k)}px 'Press Start 2P'`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("$", cx + 6 * S + 1, cy + 10 * S + 6 * k);
  }
  if (crown) {
    const rows = ["...G.GG.G...", "...GGGGGG...", "...GGRRGG..."];
    const top = (gy) => cy + (gy - 2) * S - Math.round(S * 0.36);
    rows.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && px(cx + gx * S - O, top(gy) - O, S + 2 * O, S + 2 * O, INK)));
    rows.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && px(cx + gx * S, top(gy), S, S, ch === "R" ? "#ff3d7f" : "#ffd25e")));
  }
}

function text(s, x, y, size, color, align = "left", shadow = true) {
  ctx.font = `${size}px 'Press Start 2P'`; ctx.textAlign = align; ctx.textBaseline = "top";
  if (shadow) { ctx.fillStyle = "#000"; ctx.fillText(s, x + size / 7, y + size / 7); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function embers(n, top, palFn) {
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = top + rnd() * (H - top), big = rnd() < 0.25, s = big ? 12 : 6;
    px(Math.round(x / 6) * 6, Math.round(y / 6) * 6, s, s, palFn(x / W));
  }
}

/* ---------- Vest critter: the mascot in a green V-neck vest ---------- */
// Site greens (theme --green #3dcc9a family), not Vest's brand colours.
const GREEN = ["#06281c", "#0f5c43", "#1f8f68", "#2fb383", "#3dcc9a", "#6ff0bf", "#c8ffe9", "#ffffff"];
const VEST = { main: "#2fb383", shade: "#1f8f68", light: "#6ff0bf", edge: "#0f5c43" };
const VEST_SPRITE = [
  "....BBBB....",
  "..BBBBBBBB..",
  ".BBBBBBBBBB.",
  "BBBBBBBBBBBB",
  "BBBBBBBBBBBB",
  "BBBBBBBBBBBB",
  "BBBBBBBBBBBB",
  "BBBBBBBBBBBB",
  "BBBBBBBBBBBB",
  "VVVLBBBBLVVV", // V-neck: lapels (L) frame the body
  "VVVVLBBLVVVV",
  "VVVVVLLVVVVV",
  "vVVVVVVVVVVv",
  ".vVVVVVVVVv.",
  "..bb....bb..",
  "..bb....bb..",
];
function vestCritter(cx, cy, S, { body = "gold", shades = true, crown = false, face = "grin" } = {}) {
  const O = Math.max(4, Math.round(S * 0.22));
  const [B, b] = BODIES[body];
  const fill = { B, b, V: VEST.main, v: VEST.shade, L: VEST.light };
  const cell = (gx, gy, c) => px(cx + gx * S, cy + gy * S, S, S, c);
  VEST_SPRITE.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && px(cx + gx * S - O, cy + gy * S - O, S + 2 * O, S + 2 * O, INK)));
  VEST_SPRITE.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && cell(gx, gy, fill[ch])));
  cell(2, 2, WHITE + "aa");
  // Vest details: a seam line at the hem, two gold buttons, a pocket with a pocket square.
  px(cx + 1 * S, cy + 12 * S, 10 * S, Math.max(2, S * 0.12), VEST.edge);
  for (const gy of [12, 13]) px(cx + 5.6 * S, cy + gy * S + S * 0.3, S * 0.8, S * 0.4, "#ffd25e");
  px(cx + 7.6 * S, cy + 10.5 * S, 2 * S, Math.max(2, S * 0.14), VEST.edge);
  px(cx + 8 * S, cy + 9.8 * S, S * 0.7, S * 0.7, "#ffd25e");
  px(cx + 8.7 * S, cy + 10 * S, S * 0.5, S * 0.5, WHITE);
  // Face: eyes on rows 4-5, a clear row, then the mouth on rows 7-8.
  if (shades) {
    for (let gx = 2; gx <= 9; gx++) cell(gx, 4, INK);
    [2, 3, 4, 7, 8, 9].forEach((gx) => cell(gx, 5, INK));
    cell(3, 4, WHITE); cell(8, 4, WHITE);
  } else {
    [[2, 5], [3, 4], [4, 5], [7, 5], [8, 4], [9, 5]].forEach(([gx, gy]) => cell(gx, gy, INK));
    cell(2, 6, "#ff6b6b99"); cell(9, 6, "#ff6b6b99");
  }
  if (face === "grin") { [4, 5, 6, 7].forEach((gx) => cell(gx, 7, INK)); cell(4, 8, INK); cell(7, 8, INK); cell(5, 8, "#ff6b6b"); cell(6, 8, "#ff6b6b"); }
  else { cell(4, 7, INK); cell(5, 8, INK); cell(6, 8, INK); cell(7, 7, INK); }
  if (crown) {
    const rows = ["...G.GG.G...", "...GGGGGG...", "...GGRRGG..."];
    const top = (gy) => cy + (gy - 2) * S - Math.round(S * 0.36);
    rows.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && px(cx + gx * S - O, top(gy) - O, S + 2 * O, S + 2 * O, INK)));
    rows.forEach((row, gy) => [...row].forEach((ch, gx) => ch !== "." && px(cx + gx * S, top(gy), S, S, ch === "R" ? "#ff3d7f" : "#ffd25e")));
  }
}

if (kind === "vest-avatar") {
  const g = ctx.createRadialGradient(W / 2, H * 0.55, 30, W / 2, H * 0.55, W * 0.62);
  g.addColorStop(0, "#3dcc9a55"); g.addColorStop(1, "#0b0c0f00");
  px(0, 0, W, H, g);
  fire({ cell: 16, heightFrac: 0.5, pal: GREEN });
  embers(70, H * 0.15, () => GREEN[5 + ((rnd() * 3) | 0) % 3]);
  const S = 28, CW = 12 * S;
  vestCritter((W - CW) / 2, 210, S, { body: "gold", shades: true, crown: true });
  fire({ cell: 16, heightFrac: 0.1, pal: GREEN, alpha: 0.95 });
} else if (kind === "vest-sheet") {
  // Four looks side by side, to pick from.
  const S = 24, CW = 12 * S, gap = (W - 4 * CW) / 5;
  const looks = [
    { label: "HAPPY", opts: { body: "gold", shades: false, face: "smile" } },
    { label: "COOL", opts: { body: "gold", shades: true, face: "smile" } },
    { label: "BOSS", opts: { body: "gold", shades: true, crown: true } },
    { label: "SILVER", opts: { body: "silver", shades: true, face: "grin" } },
  ];
  looks.forEach((l, i) => {
    const x = gap + i * (CW + gap);
    vestCritter(x, 140, S, l.opts);
    text(l.label, x + CW / 2, 600, 28, "#9aa0aa", "center");
  });
} else if (kind === "avatar") {
  /* ---------- Avatar: the crowned critter in red flames ---------- */
  const g = ctx.createRadialGradient(W / 2, H * 0.55, 30, W / 2, H * 0.55, W * 0.62);
  g.addColorStop(0, "#d01c1466"); g.addColorStop(1, "#0b0c0f00");
  px(0, 0, W, H, g);
  fire({ cell: 16, heightFrac: 0.62, pal: RED });
  embers(70, H * 0.15, () => RED[5 + ((rnd() * 3) | 0) % 3]);
  // Sized and placed to sit inside X's circular crop.
  const S = 34, CW = 12 * S;
  critter((W - CW) / 2, 248, S, { body: "gold", crown: true, chain: true });
  // Front flames over the feet.
  fire({ cell: 16, heightFrac: 0.14, pal: RED, alpha: 0.95 });
} else {
  /* ---------- Banner: wordmark, heat scale, podium ---------- */
  const g = ctx.createRadialGradient(W * 0.8, H * 0.7, 40, W * 0.8, H * 0.7, W * 0.42);
  g.addColorStop(0, "#d01c1440"); g.addColorStop(1, "#0b0c0f00");
  px(0, 0, W, H, g);
  fire({ cell: 20, heightFrac: 0.26 });
  embers(160, H * 0.2, (f) => heatColor(6, f));

  // Podium, right side: silver · gold · bronze.
  const S = 20, CW = 12 * S, base = H - 70, GAP = 50, mid = W * 0.8;
  const spots = [
    { x: mid - CW * 1.5 - GAP, h: 250, body: "silver", opts: { shades: true, face: "smile" }, n: "2", c: "#c9ced6" },
    { x: mid - CW / 2,          h: 330, body: "gold",   opts: { shades: true, crown: true, chain: true }, n: "1", c: "#ffd25e" },
    { x: mid + CW / 2 + GAP,    h: 190, body: "bronze", opts: { shades: false, face: "smile" }, n: "3", c: "#d0844a" },
  ];
  for (const s of spots) {
    const top = base - s.h;
    px(s.x - 10, top - 10, CW + 20, s.h + 80, INK);
    px(s.x, top, CW, s.h + 80, "#16181d");
    px(s.x, top, CW, 14, s.c);
    text(s.n, s.x + CW / 2, top + 44, 56, s.c, "center", false);
    critter(s.x, top - 12 * S - 16, S, { body: s.body, ...s.opts });
  }
  fire({ cell: 20, heightFrac: 0.07, alpha: 0.95 });

  // Wordmark block, centre. Clear of the avatar, which covers the bottom-left.
  const tx = W * 0.27, ty = H * 0.25;
  text("VEST", tx, ty, 120, "#ffffff");
  text("PAYOUTS", tx, ty + 150, 120, "#ffd04a");
  text("EVERY VEST PAYOUT, TRACKED", tx, ty + 330, 34, "#e6e8ec");
  text("AND VERIFIED ON-CHAIN", tx, ty + 384, 34, "#e6e8ec");
  // Heat scale, the brand's signature.
  const METER = ["#3fb2ff", "#5fc4ff", "#8fd8ff", "#ffe680", "#ffd04a", "#ffb53a", "#ff7a2e", "#f2481b", "#d6231a", "#a80f0f"];
  METER.forEach((c, i) => { px(tx + i * 62 - 6, ty + 470 - 6, 52 + 12, 40 + 12, INK); px(tx + i * 62, ty + 470, 52, 40, c); });
  text("VESTPAYOUTS.COM", tx + 10 * 62 + 30, ty + 474, 30, "#9aa0aa");
}

window.__done = true;
})();
</script>
</body>
</html>
