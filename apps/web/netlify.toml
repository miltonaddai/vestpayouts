# Netlify builds only the website. The API (apps/api) deploys to Railway from
# the root Dockerfile.
#
# Monorepo setup in the Netlify UI: base directory = repository root,
# project (package directory) = apps/web. Netlify reads this file from the
# package directory, but runs the command and resolves publish from the base
# directory (the repository root), so both name apps/web explicitly.
# Yarn 1 installs the whole workspace from the root, so @vestpayouts/shared resolves.

[build]
  command = "yarn workspace @vestpayouts/web build"
  publish = "apps/web/.next"
  # Skip the build when a commit touches only the API, migrations or docs.
  # Exit 0 cancels the build; anything else builds. Until a deploy succeeds,
  # CACHED_COMMIT_REF equals COMMIT_REF, so the first check forces a build.
  # `:/` pathspecs are relative to the repository root, whatever the cwd.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/apps/web :/packages/shared :/package.json :/yarn.lock"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_* values are public by design: Next.js inlines them into the
  # browser bundle, and several (site URL, handle, email) match strings used
  # throughout the repo. Real secrets (CLICK_LOG_SECRET, REVALIDATE_SECRET)
  # stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_TWITTER_HANDLE,NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION,NEXT_PUBLIC_VEST_REFERRAL_URL,NEXT_PUBLIC_VEST_REFERRAL_CODE,NEXT_PUBLIC_VEST_REFERRAL_PARAM,NEXT_PUBLIC_REFERRAL_APPEND_UTM"
