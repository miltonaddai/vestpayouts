# Netlify builds only the website (apps/web). The API (apps/api) deploys to
# Railway from the root Dockerfile.
#
# Netlify detects Next.js and applies its Next.js runtime automatically. Yarn 1
# run inside apps/web installs the whole workspace from the repository root,
# which is what @vestpayouts/shared needs.

[build]
  base = "apps/web"
  command = "yarn build"
  publish = ".next"
  # Skip the build when a commit touches only the API, migrations or docs.
  # Paths are relative to the base directory.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/shared ../../package.json ../../yarn.lock ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
